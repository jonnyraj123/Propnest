name: Android

on:
  push:
    paths:
      - 'android-game/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-game/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-game

    env:
      # Present only once the signing secrets have been added to the repository.
      KEYSTORE_BASE64: ${{ secrets.DUSKHOLLOW_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duskhollow.jks"

      - name: Build release bundle
        env:
          DUSKHOLLOW_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/duskhollow.jks', runner.temp) || '' }}
          DUSKHOLLOW_KEYSTORE_PASSWORD: ${{ secrets.DUSKHOLLOW_KEYSTORE_PASSWORD }}
          DUSKHOLLOW_KEY_ALIAS: ${{ secrets.DUSKHOLLOW_KEY_ALIAS }}
          DUSKHOLLOW_KEY_PASSWORD: ${{ secrets.DUSKHOLLOW_KEY_PASSWORD }}
          DUSKHOLLOW_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease

      # Artifact storage is unreachable from some networks, so the APK is also
      # committed to the branch. It lands outside android-game/ on purpose: the
      # path filters above ignore it, so this push cannot retrigger the workflow.
      - name: Commit debug APK to the branch
        if: github.ref_name == 'claude/hello-world-ww345u'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p builds
          cp android-game/app/build/outputs/apk/debug/*.apk builds/duskhollow-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/duskhollow-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Publish debug APK from run ${{ github.run_number }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android-game/core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duskhollow-debug-apk
          path: android-game/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Play Store bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duskhollow-release-aab
          path: android-game/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
