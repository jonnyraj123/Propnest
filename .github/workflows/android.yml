name: Android

on:
  push:
    paths:
      - 'android-game/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android-game/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-game

    env:
      # Present only once the signing secrets have been added to the repository.
      KEYSTORE_BASE64: ${{ secrets.DUSKHOLLOW_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run game logic tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/duskhollow.jks"

      - name: Build release bundle
        env:
          DUSKHOLLOW_KEYSTORE: ${{ env.KEYSTORE_BASE64 != '' && format('{0}/duskhollow.jks', runner.temp) || '' }}
          DUSKHOLLOW_KEYSTORE_PASSWORD: ${{ secrets.DUSKHOLLOW_KEYSTORE_PASSWORD }}
          DUSKHOLLOW_KEY_ALIAS: ${{ secrets.DUSKHOLLOW_KEY_ALIAS }}
          DUSKHOLLOW_KEY_PASSWORD: ${{ secrets.DUSKHOLLOW_KEY_PASSWORD }}
          DUSKHOLLOW_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android-game/core/build/reports/tests/test
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duskhollow-debug-apk
          path: android-game/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Play Store bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duskhollow-release-aab
          path: android-game/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
