<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greggs Cleaning Services</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anton&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#2f7fae;--hf:400 1em Anton,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0608;font-family:Inter,sans-serif;color:#fff;overflow:hidden}
.hero{position:relative;height:100vh;overflow:hidden}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.12);animation:zoom 12s cubic-bezier(.2,.6,.2,1) forwards}
@keyframes zoom{to{transform:scale(1)}}
.shade{position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,.6) 60%,rgba(0,0,0,.75)),linear-gradient(180deg,rgba(0,0,0,.45),transparent 25%,transparent 70%,rgba(0,0,0,.6))}
.tint{position:absolute;inset:0;background:var(--acc);mix-blend-mode:soft-light;opacity:.35}
.intro{position:absolute;inset:0;background:#0a0608;z-index:60;animation:intro 1.3s .1s cubic-bezier(.7,0,.2,1) forwards}
@keyframes intro{to{opacity:0;visibility:hidden}}
.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.12);position:relative;overflow:hidden}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.12) 20%,transparent 40%,transparent 60%,rgba(255,255,255,.12) 80%,rgba(255,255,255,.45));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
nav.glass{position:absolute;top:22px;left:48px;right:48px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 14px 28px;border-radius:999px;opacity:0;animation:drop .9s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes drop{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
.logo{font:var(--hf);font-size:24px;letter-spacing:.02em}
.links{display:flex;gap:44px;font-size:14px;color:rgba(255,255,255,.8);letter-spacing:.03em}
.pill{background:#fff;color:#0a0608;padding:13px 26px;border-radius:999px;font-weight:500;font-size:14px;letter-spacing:.02em;box-shadow:0 0 20px rgba(255,255,255,.3),0 0 40px rgba(255,255,255,.1)}
.pill.acc{background:var(--acc);color:#fff;box-shadow:0 0 24px var(--acc),0 0 60px color-mix(in srgb,var(--acc) 40%,transparent)}
.center{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;margin-top:-40px}
.kick{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:rgba(255,255,255,.8);opacity:0;animation:fade 1s 1.2s forwards;margin-bottom:22px}
h1{font:var(--hf);font-size:104px;line-height:.92;letter-spacing:-.01em;text-shadow:0 0 40px rgba(255,255,255,.4),0 0 80px rgba(255,255,255,.2),0 0 120px rgba(255,255,255,.1)}
h1 .w{display:inline-block;opacity:0;filter:blur(16px);transform:translateY(30px);animation:word 1.2s cubic-bezier(.2,.8,.2,1) forwards}
h1 em{font-style:italic;color:color-mix(in srgb,var(--acc) 35%,#fff);text-shadow:0 2px 30px rgba(0,0,0,.6),0 0 60px color-mix(in srgb,var(--acc) 60%,transparent)}
@keyframes word{to{opacity:1;filter:none;transform:none}}
.sub{margin-top:26px;max-width:560px;font-size:17px;line-height:1.6;color:rgba(255,255,255,.75);opacity:0;animation:fade 1s 2.3s forwards}
.cta{display:flex;gap:14px;margin-top:34px;opacity:0;animation:rise .9s 2.6s cubic-bezier(.2,.8,.2,1) forwards}
.ghost{padding:13px 24px;border-radius:999px;font-size:14px}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.foot{position:absolute;left:48px;right:48px;bottom:34px;z-index:20;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:rgba(255,255,255,.65);opacity:0;animation:fade 1s 3s forwards}
.chips{display:flex;gap:10px}.chips span{padding:9px 16px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.snd{display:flex;align-items:center;gap:12px}.snd i{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
.snd i:after{content:"";width:14px;height:2px;background:#fff;animation:eq 1.2s ease-in-out infinite}
@keyframes eq{50%{width:6px}}
@media (max-width:820px){.links,.foot{display:none}nav{left:16px;right:16px}h1{font-size:52px}}
</style></head><body>
<section class="hero">
  <video src="bg.webm" autoplay muted loop playsinline></video>
  <div class="tint"></div><div class="shade"></div>
  <nav class="glass"><div class="logo">Greggs Cleaning Services</div><div class="links"><span>Services</span><span>Gallery</span><span>Reviews</span><span>Visit</span></div><div class="pill">Get a quote</div></nav>
  <div class="center">
    <div class="kick">Raleigh · North Carolina</div>
    <h1><span class='w' style='animation-delay:1.30s'>Quality</span> <span class='w' style='animation-delay:1.44s'>cleaning</span><br><span class='w' style='animation-delay:1.58s'><em>you</em></span> <span class='w' style='animation-delay:1.72s'><em>can</em></span> <span class='w' style='animation-delay:1.86s'><em>depend</em></span> <span class='w' style='animation-delay:2.00s'><em>on.</em></span></h1>
    <p class="sub">Home and office cleaning across Raleigh, with a customized quote for every space.</p>
    <div class="cta"><div class="pill acc">Get a quote →</div><div class="ghost glass">(919) 679-2311</div></div>
  </div>
  <div class="foot"><div class="snd"><i></i><span>Raleigh · North Carolina</span></div><div class="chips"><span>Home cleaning</span><span>Office</span><span>Custom quote</span></div></div>
  <div class="intro"></div>
</section>
</body></html>
