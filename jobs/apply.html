<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application form — WorkAbroad Hub</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-lang="en" style="background:var(--wash)">


<div class="langbar noprint" id="langbar">
  <button data-lang-btn="en">English</button>
  <button data-lang-btn="hi">हिंदी</button>
  <button data-lang-btn="bn">বাংলা</button>
</div>

<header class="noprint"><div class="wrap hd">
  <a class="callpill" id="callpill" href="#">📞 <span></span></a>
  <a class="brand" href="index.html">
    <img src="logo.png" alt="WorkAbroad Hub">
    <span>
      <span class="nm">Work<em>Abroad</em> Hub</span>
      <span class="sub">CONNECTING YOU TO GLOBAL OPPORTUNITIES</span>
    </span>
  </a>
  <a class="btn gh hdcta" href="index.html" data-t="ap.home"></a>
</div></header>

<div class="formwrap">

  <div class="crumb noprint"><a href="index.html" data-t="ap.home"></a> › <span data-t="ap.crumb"></span></div>
  <div class="prog noprint"><div class="on"></div><div class="on"></div><div></div></div>

  <!-- ============ FORM ============ -->
  <div id="formzone">
    <div class="card">
      <h1 data-t="ap.title"></h1>
      <p class="led" data-t="ap.lead"></p>

      <div class="feesm">
        <span data-t="ap.note"></span>
        <a href="index.html#fees" target="_blank" data-t="ap.more"></a>
      </div>

      <form id="applyform" name="job-application" method="POST"
            data-netlify="true" netlify-honeypot="company-name" enctype="multipart/form-data">
        <input type="hidden" name="form-name" value="job-application">
        <input type="hidden" name="application-no" id="f-appno">
        <input type="hidden" name="language" id="f-lang">
        <p class="hp"><label>Leave this empty <input name="company-name"></label></p>

        <fieldset>
          <legend data-t="ap.s1"></legend>
          <div class="row">
            <div class="fld">
              <label for="f-country"><span data-t="ap.country"></span> <span class="req">*</span></label>
              <select id="f-country" name="country"></select>
              <span class="emsg"></span>
            </div>
            <div class="fld">
              <label for="f-job"><span data-t="ap.job"></span> <span class="req">*</span></label>
              <select id="f-job" name="trade"></select>
              <span class="emsg"></span>
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-t="ap.s2"></legend>
          <div class="row">
            <div class="fld">
              <label for="f-name"><span data-t="ap.name"></span> <span class="req">*</span></label>
              <input id="f-name" name="name" type="text" autocomplete="name" data-ph="ap.namePh">
              <span class="emsg"></span>
            </div>
            <div class="fld">
              <label for="f-phone"><span data-t="ap.phone"></span> <span class="req">*</span></label>
              <input id="f-phone" name="mobile" type="tel" inputmode="numeric" autocomplete="tel" data-ph="ap.phonePh">
              <span class="emsg"></span>
            </div>
          </div>
          <div class="row">
            <div class="fld">
              <label for="f-age"><span data-t="ap.age"></span> <span class="req">*</span></label>
              <input id="f-age" name="age" type="number" min="18" max="60" placeholder="28">
              <span class="emsg"></span>
            </div>
            <div class="fld">
              <label for="f-dist" data-t="ap.dist"></label>
              <input id="f-dist" name="district" type="text" data-ph="ap.distPh">
            </div>
          </div>
        </fieldset>

        <fieldset>
          <legend data-t="ap.s3"></legend>
          <div class="row">
            <div class="fld">
              <label for="f-exp"><span data-t="ap.exp"></span> <span class="req">*</span></label>
              <select id="f-exp" name="experience"></select>
              <span class="emsg"></span>
            </div>
            <div class="fld">
              <label for="f-haspp"><span data-t="ap.hasPp"></span> <span class="req">*</span></label>
              <select id="f-haspp" name="has-passport"></select>
            </div>
          </div>
          <div class="fld">
            <label for="f-passport" data-t="ap.pp"></label>
            <input id="f-passport" name="passport-no" type="text" placeholder="M1234567" maxlength="8"
                   style="text-transform:uppercase">
            <div class="hint" data-t="ap.ppHint"></div>
            <span class="emsg"></span>
          </div>
          <div class="fld">
            <label for="f-cv" data-t="ap.cv"></label>
            <div class="file">
              <div class="ttl" data-t="ap.cvT"></div>
              <div class="hint" style="margin-bottom:9px" data-t="ap.cvHint"></div>
              <input id="f-cv" name="cv" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
            </div>
          </div>
          <div class="fld">
            <label for="f-note" data-t="ap.msg"></label>
            <textarea id="f-note" name="message" rows="3" data-ph="ap.msgPh"></textarea>
          </div>
        </fieldset>

        <label class="chkline">
          <input type="checkbox" id="f-agree" name="terms-accepted" value="yes">
          <span data-t="ap.agree"></span>
        </label>
        <label class="chkline" style="margin-bottom:20px">
          <input type="checkbox" id="f-call" name="contact-consent" value="yes" checked>
          <span data-t="ap.callOk"></span>
        </label>

        <button type="submit" class="btn wide lg" id="f-submit" data-t="ap.submit"></button>
        <p style="text-align:center;font-size:13.5px;color:var(--mut);margin-top:11px" data-t="ap.priv"></p>
      </form>
    </div>
  </div>

  <!-- ============ RECEIPT ============ -->
  <div id="receipt" class="receipt">
    <div class="rcard">

      <div class="rhead">
        <img src="logo.png" alt="WorkAbroad Hub">
        <span class="bnd"><b>WorkAbroad Hub</b><span>CONNECTING YOU TO GLOBAL OPPORTUNITIES</span></span>
        <span class="doc"><b data-t="rc.doc"></b><span id="r-date2">—</span></span>
      </div>
      <div class="goldrule"></div>

      <div class="rtop">
        <div class="rtick">✓</div>
        <h2 data-t="rc.ok"></h2>
        <p data-t="rc.okSub"></p>
      </div>

      <div class="rbody">
        <div class="wmark"><img src="logo.png" alt=""></div>

        <div class="rno">
          <small data-t="rc.no"></small>
          <b id="r-no">WAH-000000-0000</b>
          <span class="hint" data-t="rc.hint"></span>
        </div>

        <div class="rgrid">
          <div class="rw"><div class="k" data-t="rc.name"></div><div class="v" id="r-name">—</div></div>
          <div class="rw"><div class="k" data-t="rc.phone"></div><div class="v" id="r-phone">—</div></div>
          <div class="rw"><div class="k" data-t="rc.country"></div><div class="v" id="r-country">—</div></div>
          <div class="rw"><div class="k" data-t="rc.job"></div><div class="v" id="r-job">—</div></div>
          <div class="rw"><div class="k" data-t="rc.date"></div><div class="v" id="r-date">—</div></div>
          <div class="rw"><div class="k" data-t="rc.status"></div>
            <div class="v"><span class="chip"><i></i> <span data-t="rc.processing"></span></span></div></div>
        </div>

        <div class="nextbox">
          <h3 data-t="rc.nextT"></h3>
          <ol id="r-next"></ol>
        </div>

        <div class="paysteps noprint">

          <div class="pstep" id="ps1">
            <div class="pshead"><span class="psn">1</span><h3 data-t="rc.step1"></h3></div>
            <div class="psbody">
              <div class="amt">₹500<small data-t="rc.once"></small></div>
              <p data-t="rc.payLine"></p>
              <a class="btn wide lg" id="r-pay" href="#" target="_blank" rel="noopener" data-t="rc.pay"></a>
              <div class="paysafe" id="r-safe"></div>
              <div class="feenote">
                <b data-t="fee.title2"></b>
                <ul id="r-feelist"></ul>
              </div>
            </div>
          </div>

          <div class="pstep lock" id="ps2">
            <div class="pshead"><span class="psn">2</span><h3 data-t="rc.step2"></h3>
              <span class="lockb" id="ps2-lock" data-t="rc.locked"></span></div>
            <div class="psbody">
              <p class="lockmsg" data-t="rc.lockMsg"></p>
              <div class="unlocked">
                <p data-t="rc.openMsg"></p>
                <div class="fld" style="margin-bottom:13px">
                  <label for="r-txn"><span data-t="rc.txn"></span>
                    <span style="color:var(--mut);font-weight:400" data-t="rc.txnOpt"></span></label>
                  <input id="r-txn" type="text" data-ph="rc.txnPh">
                  <div class="hint" data-t="rc.txnHint"></div>
                </div>
                <a class="btn wa wide lg" id="r-wa" href="#" target="_blank" rel="noopener" data-t="rc.wa"></a>
              </div>
            </div>
          </div>

        </div>

        <div class="rbtns noprint">
          <button class="btn gh" id="r-print" data-t="rc.print"></button>
          <a class="btn gh" id="r-new" href="apply.html" data-t="rc.again"></a>
        </div>

        <div class="rfoot">
          <span><span data-t="rc.footL"></span> <span id="r-ph2">—</span></span>
          <span data-t="rc.footR"></span>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
