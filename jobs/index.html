<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkAbroad Hub — Licensed overseas recruitment from Kolkata</title>
<meta name="description" content="Licensed recruiting agency placing workers in Dubai, Saudi Arabia, Qatar, Kuwait, Russia, Europe, Canada, Singapore and more. Construction, driving, factory, hotel and technical trades. Apply online in 3 minutes.">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-lang="en">


<!-- language switcher -->
<div class="langbar" id="langbar">
  <button data-lang-btn="en">English</button>
  <button data-lang-btn="hi">हिंदी</button>
  <button data-lang-btn="bn">বাংলা</button>
</div>

<header id="hdr">
  <div class="wrap hd">
    <a class="callpill" id="callpill" href="#">📞 <span></span></a>
    <a class="brand" href="index.html">
      <img src="logo.png" alt="WorkAbroad Hub">
      <span>
        <span class="nm">Work<em>Abroad</em> Hub</span>
        <span class="sub">CONNECTING YOU TO GLOBAL OPPORTUNITIES</span>
      </span>
    </a>
    <a class="btn hdcta" href="apply.html" data-t="nav.apply"></a>
  </div>
  <div class="navrow"><div class="wrap">
    <nav>
      <a href="#jobs" data-t="nav.jobs"></a>
      <a href="#countries" data-t="nav.countries"></a>
      <a href="#process" data-t="nav.process"></a>
      <a href="#fees" data-t="nav.fees"></a>
      <a href="#faq" data-t="nav.faq"></a>
    </nav>
  </div></div>
</header>

<!-- ============ HERO ============ -->
<div class="hero">
  <div class="stars" id="stars"></div>
  <div class="wrap">

    <div>
      <span class="badge"><span class="dot"></span><span data-t="hero.badge"></span></span>
      <h1><span data-t="hero.t1"></span><span class="l2" data-t="hero.t2"></span></h1>
      <p class="lede" data-t="hero.sub"></p>
      <div class="hcta">
        <a class="btn lg" href="apply.html" data-t="hero.cta"></a>
        <a class="btn lg glass" id="hero-wa" href="#" target="_blank" rel="noopener" data-t="hero.cta2"></a>
      </div>
      <p class="hnote"><span>✈️</span><span data-t="hero.note"></span></p>
    </div>

    <div class="globewrap">
      <div class="glow"></div>
      <div class="globe">
        <svg viewBox="0 0 400 400" aria-hidden="true">
          <defs>
            <radialGradient id="gSea" cx="36%" cy="30%">
              <stop offset="0%" stop-color="#3E74C8"/>
              <stop offset="60%" stop-color="#1B4488"/>
              <stop offset="100%" stop-color="#0A2352"/>
            </radialGradient>
            <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#F0A81E"/>
              <stop offset="55%" stop-color="#FFD98A"/>
              <stop offset="100%" stop-color="#F0A81E" stop-opacity=".25"/>
            </linearGradient>
            <clipPath id="ball"><circle cx="200" cy="200" r="122"/></clipPath>
            <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
          </defs>

          <circle cx="200" cy="200" r="150" fill="#5D98FF" opacity=".12" filter="url(#soft)"/>
          <circle cx="200" cy="200" r="122" fill="url(#gSea)"/>

          <!-- rotating surface -->
          <g clip-path="url(#ball)" class="spin" opacity=".95">
            <g fill="#8FD6B0" opacity=".92">
              <path d="M96 128c18-14 44-16 60-6s10 26 24 32 34-2 40 12-14 24-30 22-26-10-42-8-30 8-44 0-26-38-8-52z"/>
              <path d="M188 208c16-6 34 2 40 16s-4 30 6 40 30 8 32 24-18 24-34 18-24-22-38-28-28-6-32-22 10-42 26-48z"/>
              <path d="M286 120c16 2 30 16 28 30s-16 18-24 12-12-20-10-30z"/>
              <path d="M320 232c14 4 22 18 18 30s-20 16-28 8-6-26 10-38z"/>
              <path d="M58 236c12-4 24 6 24 18s-12 22-22 18-14-32-2-36z"/>
            </g>
            <g stroke="#BFE0FF" stroke-width="1" fill="none" opacity=".3">
              <ellipse cx="200" cy="200" rx="122" ry="42"/>
              <ellipse cx="200" cy="200" rx="122" ry="82"/>
              <ellipse cx="200" cy="200" rx="42" ry="122"/>
              <ellipse cx="200" cy="200" rx="82" ry="122"/>
              <line x1="78" y1="200" x2="322" y2="200"/>
            </g>
          </g>

          <!-- gloss -->
          <circle cx="200" cy="200" r="122" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>
          <ellipse cx="158" cy="152" rx="52" ry="34" fill="#fff" opacity=".13" transform="rotate(-28 158 152)"/>

          <!-- orbits -->
          <g class="orbit">
            <ellipse cx="200" cy="200" rx="168" ry="66" fill="none"
                     stroke="url(#gRing)" stroke-width="2.4" stroke-dasharray="7 9"
                     transform="rotate(-22 200 200)"/>
          </g>
          <g class="orbit-2">
            <ellipse cx="200" cy="200" rx="152" ry="150" fill="none"
                     stroke="rgba(255,255,255,.16)" stroke-width="1.4" stroke-dasharray="3 12"/>
          </g>

          <!-- plane riding the orbit -->
          <g class="plane">
            <g transform="rotate(-22 200 200)">
              <g transform="translate(368 200) rotate(96)">
                <path d="M3 0L-13-5.5 -9.5-1.4 -19.5-1.4 -22.5-5 -25-5 -22.8 0 -25 5 -22.5 5 -19.5 1.4 -9.5 1.4 -13 5.5Z"
                      fill="#FFFFFF"/>
                <circle cx="-26" cy="0" r="1.6" fill="#FFD98A" opacity=".9"/>
              </g>
            </g>
          </g>

          <!-- destination pins -->
          <circle class="pin" cx="248" cy="150" r="3" fill="#FFD98A"/>
          <circle class="pin" cx="152" cy="238" r="3" fill="#FFD98A"/>
          <circle class="pin" cx="266" cy="246" r="3" fill="#FFD98A"/>
        </svg>
      </div>
    </div>

    <!-- picker card sits under the copy on desktop grid flow -->
  </div>

  <div class="wrap" style="position:relative;z-index:2;margin-top:34px;max-width:1180px">
    <div class="pick" style="max-width:560px;margin:0 auto" id="pickcard">
      <h3 data-t="picker.title"></h3>
      <p class="cap" data-t="picker.sub"></p>
      <label data-t="picker.country" for="hc-country"></label>
      <select id="hc-country"></select>
      <label data-t="picker.job" for="hc-job"></label>
      <select id="hc-job"></select>
      <button class="btn nv wide lg" id="hc-go" data-t="picker.go"></button>
      <p class="free" data-t="picker.free"></p>
    </div>
  </div>
</div>

<!-- destination marquee -->
<div class="strip"><div class="track" id="track"></div></div>

<!-- stats -->
<div class="stats"><div class="wrap" id="stats"></div></div>

<!-- ============ PROCESS ============ -->
<section id="process"><div class="wrap">
  <div class="sec-h rv">
    <div class="kick" data-t="process.kick"></div>
    <h2 data-t="process.title"></h2>
    <p data-t="process.sub"></p>
  </div>
  <div class="steps rv" id="steps"></div>
</div></section>

<!-- ============ JOBS ============ -->
<section class="alt" id="jobs"><div class="wrap">
  <div class="sec-h rv">
    <div class="kick" data-t="jobs.kick"></div>
    <h2 data-t="jobs.title"></h2>
    <p data-t="jobs.sub"></p>
  </div>
  <div class="jobs rv" id="joblist"></div>
</div></section>

<!-- ============ COUNTRIES ============ -->

  </div>
  <div class="countries rv" id="countrylist"></div>
</div></section>

<!-- ============ WHY ============ -->
<section><div class="wrap">

    <div class="kick" data-t="why.kick"></div>

<!-- ============ REVIEWS ============ -->
<section><div class="wrap">
  <div class="sec-h rv">

  <div class="revs rv" id="revlist"></div>

<!-- ============ FAQ ============ -->
<section class="alt" id="faq"><div class="wrap">

<!-- ============ CTA ============ -->
<div class="band"><div class="wrap">
  <h2 data-t="band.title"></h2>
  <p data-t="band.sub"></p>
  <a class="btn lg" href="apply.html" data-t="band.cta"></a>
</div></div>

<footer><div class="wrap">
  <div class="cols">
    <div>
      <div class="fbrand"><img src="logo.png" alt=""><b>WorkAbroad Hub</b></div>
      <p data-t="foot.about"></p>
    </div>
    <div>
      <h4 data-t="foot.contact"></h4>
      <a id="ft-phone" href="#"></a>
      <a id="ft-wa" href="#" target="_blank" rel="noopener">💬 WhatsApp</a>
      <a id="ft-mail" href="#"></a>
      <a id="ft-city"></a>
    </div>
    <div>
      <h4 data-t="foot.links"></h4>
      <a href="apply.html" data-t="foot.l.0"></a>
      <a href="#fees" data-t="foot.l.1"></a>
      <a href="#faq" data-t="foot.l.2"></a>
      <a href="#process" data-t="foot.l.3"></a>
    </div>
  </div>
  <div class="fbot">
    <span data-t="foot.rights"></span>
    <span data-t="foot.disc"></span>
  </div>
</div></footer>

<a class="fab noprint" id="fab" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

<script src="i18n.js"></script>

</body>
</html>
