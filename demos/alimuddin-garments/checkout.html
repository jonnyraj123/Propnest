<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e8798f'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23ffffff' font-family='Georgia' font-weight='700'%3EMA%3C/text%3E%3C/svg%3E">
<title>Shop Details · ALIMUDDIN Garments</title>
</head>
<body data-page="cart">
<div id="hdr"></div>
<main class="wrap">
  <section class="page-hero" style="padding-bottom:20px"><p class="eyebrow" style="justify-content:center">Step 3 of 3</p><h1>Your <em>shop details</em></h1><p>We use these only to confirm and deliver your order.</p></section>
  <div class="cart-grid" id="wrapC">
    <form class="panel" id="f" novalidate>
      <div class="form">
        <div class="fld"><label for="shop">Shop name *</label><input id="shop" required autocomplete="organization"></div>
        <div class="fld"><label for="name">Your name *</label><input id="name" required autocomplete="name"></div>
        <div class="fld"><label for="phone">WhatsApp number *</label><input id="phone" required inputmode="tel" autocomplete="tel" placeholder="10-digit mobile"></div>
        <div class="fld"><label for="gst">GST number (optional)</label><input id="gst" autocomplete="off"></div>
        <div class="fld full"><label for="addr">Delivery address *</label><textarea id="addr" rows="3" required autocomplete="street-address"></textarea></div>
        <div class="fld"><label for="city">City *</label><input id="city" required autocomplete="address-level2"></div>
        <div class="fld"><label for="pin">PIN code *</label><input id="pin" required inputmode="numeric" maxlength="6" autocomplete="postal-code"></div>
        <div class="fld full"><label>How do you want to get the parcel?</label>
          <div class="pays">
            <label><input type="radio" name="del" value="Pick up from shop" checked>🏬 Pick up<small>From our Kolkata shop</small></label>
            <label><input type="radio" name="del" value="Courier / transport">🚚 Courier / transport<small>Anywhere in India</small></label>
            <label><input type="radio" name="del" value="Local delivery (Kolkata)">🛵 Local delivery<small>Within Kolkata</small></label>
          </div></div>
        <div class="fld full"><label>Payment (after we confirm)</label>
          <div class="pays">
            <label><input type="radio" name="pay" value="UPI" checked>📱 UPI<small>GPay / PhonePe / Paytm</small></label>
            <label><input type="radio" name="pay" value="Bank transfer">🏦 Bank transfer<small>NEFT / IMPS</small></label>
            <label><input type="radio" name="pay" value="Cash at shop">💵 Cash at shop<small>When you pick up</small></label>
          </div></div>
        <div class="fld full"><label for="note">Note (optional)</label><textarea id="note" rows="2" placeholder="Any special request…"></textarea></div>
      </div>
      <p id="err" class="note" style="margin-top:12px" hidden>Please fill all fields marked *. Phone needs 10 digits and PIN 6 digits.</p>
      <button class="btn btn-leaf" style="width:100%;margin-top:18px" type="submit">Place order request ✨</button>
      <p class="muted" style="font-size:13px;margin-top:10px;text-align:center">No money is taken on this website.</p>
    </form>
    <aside class="sum" id="sum"></aside>
  </div>
</main>
<div id="ftr"></div>
<script src="assets/js/lenis.min.js"></script>
<script src="assets/data.js?v=5"></script>
<script src="assets/app.js?v=5"></script>
<script>
(() => {
  const { $, rupee, Cart, img, store } = AG;
  const items = Cart.all().filter(it => AG.byId(it.id));
  if (!items.length) { location.replace('cart.html'); return; }
  const t = Cart.totals();
  $('#sum').innerHTML = `<h3>Order</h3>${items.map(it => { const l = Cart.line(it); return `<div class="ln" style="gap:10px;align-items:center"><span style="display:flex;gap:10px;align-items:center"><img src="${img(l.p.img[0], 1)}" alt="" style="width:40px;height:50px;object-fit:cover;border-radius:8px">${l.p.name}</span><b style="white-space:nowrap">${l.pcs} pcs</b></div>`; }).join('')}
    <div class="ln"><span>Total pieces</span><b>${t.pcs}</b></div><div class="ln tot"><span>Estimate</span><b>${t.total ? rupee(t.total) : '—'}</b></div>${t.ask ? `<small>${t.ask} design(s) priced on WhatsApp.</small>` : ''}`;
  const saved = store.get('ag_shop', {}); ['shop', 'name', 'phone', 'gst', 'addr', 'city', 'pin'].forEach(k => { if (saved[k]) $('#' + k).value = saved[k]; });
  $('#f').addEventListener('submit', e => {
    e.preventDefault();
    const v = k => $('#' + k).value.trim();
    const phone = v('phone').replace(/\D/g, '').slice(-10);
    const bad = ['shop', 'name', 'addr', 'city'].some(k => !v(k)) || phone.length !== 10 || !/^\d{6}$/.test(v('pin'));
    $('#err').hidden = !bad; if (bad) { $('#err').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const shop = { shop: v('shop'), name: v('name'), phone, gst: v('gst'), addr: v('addr'), city: v('city'), pin: v('pin') };
    store.set('ag_shop', shop);
    const no = 'AG' + Date.now().toString().slice(-6);
    store.set('ag_last', { no, at: new Date().toISOString(), shop, del: $('input[name=del]:checked').value, pay: $('input[name=pay]:checked').value, note: v('note'), items, totals: t });
    Cart.save([]);
    location.href = 'thankyou.html';
  });
})();
</script>
</body>
</html>
