<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e8798f'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='%23ffffff' font-family='Georgia' font-weight='700'%3EMA%3C/text%3E%3C/svg%3E">
<title>Thank You · ALIMUDDIN Garments</title>
</head>
<body data-page="thanks">
<div id="hdr"></div>
<main>
  <section class="ty"><div class="wrap" id="ty"></div></section>
</main>
<div id="ftr"></div>
<script src="assets/js/lenis.min.js"></script>
<script src="assets/data.js?v=6"></script>
<script src="assets/app.js?v=6"></script>
<script>
(() => {
  const { $, store, wa, rupee, byId, confetti } = AG;
  const o = store.get('ag_last', null);
  if (!o) { $('#ty').innerHTML = `<div class="ty-badge">🛍️</div><h1>Nothing here <em>yet</em></h1><p class="ty-msg">Your order confirmation will show here after you place an order.</p><div class="acts"><a class="btn btn-leaf" href="shop.html">Browse designs</a></div>`; return; }
  const lines = o.items.map((it, i) => { const p = byId(it.id); if (!p) return ''; const rows = Object.entries(it.q).filter(([, v]) => v).map(([k, v]) => { const [c, s] = k.split('|'); return `   ${c} / ${s} × ${v}`; }).join('\n'); const pcs = Object.values(it.q).reduce((a, b) => a + b, 0); return `${i + 1}. ${p.name}${p.code ? ' (Code ' + p.code + ')' : ''} — ${pcs} pcs\n${rows}`; }).join('\n');
  const text = `🛍️ *New wholesale order ${o.no}*\n\n${lines}\n\nTotal: ${o.totals.pcs} pcs${o.totals.total ? ' · Estimate ' + rupee(o.totals.total) : ''}\n\n*Shop:* ${o.shop.shop}\n*Name:* ${o.shop.name}\n*Phone:* ${o.shop.phone}${o.shop.gst ? '\n*GST:* ' + o.shop.gst : ''}\n*Address:* ${o.shop.addr}, ${o.shop.city} – ${o.shop.pin}\n*Delivery:* ${o.del}\n*Payment:* ${o.pay}${o.note ? '\n*Note:* ' + o.note : ''}`;
  const first = o.shop.name.split(' ')[0];
  $('#ty').innerHTML = `
    <div class="ty-badge"><svg viewBox="0 0 64 64" fill="none"><path d="M16 33l11 11 22-24" stroke="#e8798f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <p class="eyebrow" style="justify-content:center">Order request received</p>
    <h1>Shukriya, <span class="gold-text">${first}!</span></h1>
    <span class="ord">ORDER NO. ${o.no}</span>
    <p class="ty-msg">Thank you for choosing ALIMUDDIN Garments for <b>${o.shop.shop}</b>. Your ${o.totals.pcs} pieces are noted. <b>One last step:</b> tap the green button to send this order to us on WhatsApp — we will check stock and confirm price and delivery with you.</p>
    <div class="acts"><a class="btn btn-wa" href="${wa(text)}" target="_blank" rel="noopener">💬 Send order on WhatsApp</a><a class="btn btn-ghost" href="shop.html">Continue browsing</a></div>
    <div class="panel ty-sum"><h3 style="font-size:22px;margin-bottom:10px">Order summary</h3>${o.items.map(it => { const p = byId(it.id); if (!p) return ''; const pcs = Object.values(it.q).reduce((a, b) => a + b, 0); return `<div class="ln" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:700"><span>${p.name}</span><b>${pcs} pcs</b></div>`; }).join('')}
      <div style="display:flex;justify-content:space-between;padding-top:10px;font-family:var(--fd);font-size:22px"><span>Total</span><b>${o.totals.pcs} pcs${o.totals.total ? ' · ' + rupee(o.totals.total) : ''}</b></div>
      <p class="muted" style="font-size:13px;margin-top:10px">${o.del} · Pay by ${o.pay} after confirmation</p></div>
    <p class="muted" style="margin-top:22px;font-weight:700">May your shelves stay full and your customers keep smiling 🌸</p>`;
  setTimeout(() => { confetti(innerWidth * .3, innerHeight * .3, 50); confetti(innerWidth * .7, innerHeight * .3, 50); }, 500);
})();
</script>
</body>
</html>
