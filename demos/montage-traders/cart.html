<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='24' r='23' fill='%230c2744'/%3E%3Cpath d='M6 33 17 18l6 8 5-6 14 13Z' fill='%23eef4f8'/%3E%3C/svg%3E">
<title>Cart · Montage Traders</title>
</head>
<body data-page="cart">
<div id="hdr"></div>
<main>
  <section class="ph"><div class="wrap"><p class="eyebrow" style="justify-content:center">Step 1 of 2</p><h1>Your <em>cart</em></h1></div></section>
  <div class="wrap" id="box"></div>
</main>
<div id="ftr"></div>
<script src="assets/js/lenis.min.js"></script>
<script src="assets/data.js?v=6"></script>
<script src="assets/app.js?v=6"></script>
<script>
(() => {
  const { $, img, rupee, Cart } = MT;
  const render = () => {
    const items = Cart.all();
    if (!items.length) { $('#box').innerHTML = `<div class="empty"><div class="big">🎒</div><h2 style="color:var(--navy)">Your cart is empty</h2><p class="muted" style="margin:10px 0 24px">Find a tent, a rod or an aquarium to get started.</p><a class="btn btn-or" href="shop.html">Go to shop</a></div>`; return; }
    const t = Cart.totals();
    $('#box').innerHTML = `<div class="cart-grid"><div>${items.map((x, i) => { const l = Cart.line(x); return `<article class="citem"><img src="${img(l.p.img[0], 1)}" alt=""><div><h3>${l.p.name}</h3><small>${l.label}</small><small>${l.price ? rupee(l.price) + ' each' : 'Price on WhatsApp'}</small></div>
      <div class="r"><span class="qty"><button data-i="${i}" data-d="-1" aria-label="Less">−</button><input value="${x.q}" readonly aria-label="Quantity"><button data-i="${i}" data-d="1" aria-label="More">+</button></span><b class="num">${l.price ? rupee(l.total) : '—'}</b><button class="lnk" data-i="${i}" data-rm>Remove</button></div></article>`; }).join('')}</div>
      <aside class="sum"><h3>Order summary</h3><div class="ln"><span>Items</span><b>${t.items}</b></div><div class="ln"><span>Delivery</span><b>Confirmed on WhatsApp</b></div><div class="ln tot"><span>Total</span><b>${rupee(t.total)}</b></div>
      ${t.ask ? `<small>+ ${t.ask} item(s) priced on WhatsApp.</small>` : ''}<a class="btn btn-or" href="checkout.html">Checkout →</a><a class="btn btn-line" href="shop.html">Continue shopping</a><small>No payment is taken on this website — pay by UPI or cash after we confirm.</small></aside></div>`;
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (!b) return; const i = +b.dataset.i, x = Cart.all()[i]; if (b.hasAttribute('data-rm')) Cart.setQ(i, 0); else Cart.setQ(i, x.q + +b.dataset.d); render(); });
  render();
})();
</script>
</body>
</html>
