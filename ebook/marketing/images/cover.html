<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-400.ttf');font-weight:400;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-600.ttf');font-weight:600;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-700.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'NSB',sans-serif}
.c{width:1280px;height:720px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#0B3A2B 0%,#12583F 48%,#1B7D5A 100%);
  display:flex;align-items:center;padding:0 78px;color:#fff}
.glow{position:absolute;right:-160px;top:-160px;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,#F59E0B 0%,transparent 62%);opacity:.20}
.band{position:absolute;left:0;right:0;bottom:0;height:14px;
  background:linear-gradient(90deg,#F59E0B 0%,#C2410C 100%)}
.L{position:relative;z-index:2;width:700px}
.kick{font-size:19px;letter-spacing:.22em;color:#8FD6BB;font-weight:700;margin-bottom:22px}
h1{font-size:70px;line-height:1.18;font-weight:700;letter-spacing:-.5px}
.rule{width:120px;height:7px;background:#F59E0B;border-radius:4px;margin:26px 0 24px}
.sub{font-size:31px;line-height:1.5;color:#CFE8DA;font-weight:600}
.pills{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.p{border:1.5px solid rgba(255,255,255,.42);border-radius:40px;padding:9px 22px;font-size:19px;color:#E4F3EC}
.price{position:absolute;right:78px;bottom:66px;z-index:3;text-align:center}
.price .amt{font-size:74px;font-weight:700;color:#F59E0B;line-height:1}
.price .lbl{font-size:20px;color:#CFE8DA;margin-top:8px}
.R{position:absolute;right:96px;top:78px;z-index:2;
  width:330px;height:452px;border-radius:14px;overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.45);transform:rotate(4deg);
  background:linear-gradient(155deg,#0B3A2B,#1B7D5A);
  padding:44px 30px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid rgba(255,255,255,.14)}
.R .k{font-size:12px;letter-spacing:.2em;color:#8FD6BB;font-weight:700;margin-bottom:14px}
.R .t{font-size:34px;font-weight:700;line-height:1.22}
.R .r{width:56px;height:5px;background:#F59E0B;border-radius:3px;margin:16px 0 14px}
.R .s{font-size:17px;color:#CFE8DA;line-height:1.5;font-weight:600}
.R .b{position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(90deg,#F59E0B,#C2410C)}
</style></head><body>
<div class="c">
  <div class="glow"></div>
  <div class="L">
    <div class="kick">বাঙালিদের জন্য</div>
    <h1>৩০ দিনের<br>বাঙালি ডায়েট প্ল্যান</h1>
    <div class="rule"></div>
    <div class="sub">ভাত, মাছ আর রুটি খেয়েই<br>ওজন কমান — না খেয়ে নয়</div>
    <div class="pills">
      <span class="p">৬১ পাতা</span>
      <span class="p">৩০ দিনের চার্ট</span>
      <span class="p">১৫টি রেসিপি</span>
      <span class="p">ট্র্যাকার</span>
    </div>
  </div>
  <div class="R">
    <div class="k">বাঙালিদের জন্য</div>
    <div class="t">৩০ দিনের বাঙালি ডায়েট প্ল্যান</div>
    <div class="r"></div>
    <div class="s">ভাত-মাছ খেয়েই<br>ওজন কমান</div>
    <div class="b"></div>
  </div>
  <div class="price"><div class="amt">₹২৯৯</div><div class="lbl">একবারই</div></div>
  <div class="band"></div>
</div></body></html>
