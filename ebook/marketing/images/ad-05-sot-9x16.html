<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-400.ttf');font-weight:400;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-600.ttf');font-weight:600;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-700.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'NSB',sans-serif}
.ad{width:1080px;height:1920px;position:relative;overflow:hidden;display:flex;
    flex-direction:column;justify-content:center;padding:87px;color:#fff}
.kick{display:inline-block;align-self:flex-start;font-size:29px;letter-spacing:.16em;
  font-weight:700;padding:13px 33px;border-radius:60px;margin-bottom:29px}
h1{font-size:116px;line-height:1.06;font-weight:700;letter-spacing:-2px}
.sub{font-size:42px;line-height:1.45;font-weight:600;margin-top:29px}
.rule{width:134px;height:12px;border-radius:8px;margin:29px 0}
.art{margin:38px 0;background:linear-gradient(160deg,#FDFBF7,#F1ECE2);
  border-radius:29px;padding:29px 29px 15px}
.art svg{width:100%;height:auto;max-height:430px}
.strip{position:absolute;left:0;right:0;bottom:0;padding:44px 87px;
  display:flex;align-items:center;justify-content:space-between;gap:20px}
.strip .t{font-size:29px;font-weight:600;line-height:1.35}
.strip .p{font-size:58px;font-weight:700;white-space:nowrap}
.strip .p s{font-size:33px;font-weight:600;opacity:.55;margin-right:14px}
.band{position:absolute;left:0;right:0;bottom:0;height:15px;
  background:linear-gradient(90deg,#F59E0B,#EA580C 55%,#C2410C)}
.glow{position:absolute;border-radius:50%;filter:blur(2px)}
.rowlist{margin-top:29px}
.rowlist div{display:flex;align-items:center;gap:22px;font-size:36px;
  font-weight:600;margin-bottom:20px}
.rowlist i{width:51px;height:51px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:29px;font-weight:700}
.num{display:flex;gap:26px;margin-top:29px}
.num .c{flex:1;border-radius:29px;padding:38px;text-align:center}
.num .c .b{font-size:87px;font-weight:700;line-height:1}
.num .c .s{font-size:29px;font-weight:600;margin-top:10px;opacity:.85}
</style></head><body><div class="ad" style="background:linear-gradient(165deg,#FDFBF7 0%,#F2EDE3 100%);color:#1C1917">
  <div class="kick" style="background:#1C1917;color:#F5C451">সৎ কথা</div>
  <h1 style="color:#0E4433">এই বইয়ে যা<br><span style="color:#C2410C">লেখা নেই।</span></h1>
  <div class="rule" style="background:#C2410C"></div>
  <div class="rowlist"><div><i style="background:#FBE9E4;color:#DC2626">✕</i><span style="color:#57534E">"১০ দিনে ১০ কেজি" প্রতিশ্রুতি</span></div><div><i style="background:#FBE9E4;color:#DC2626">✕</i><span style="color:#57534E">জিম বা দামি সাপ্লিমেন্ট</span></div><div><i style="background:#FBE9E4;color:#DC2626">✕</i><span style="color:#57534E">না খেয়ে থাকা</span></div><div style="height:%(GAP)spx"></div><div style="font-size:%(KS)spx;letter-spacing:.14em;font-weight:700;color:#15654A;margin-bottom:%(RMB)spx">যা আছে</div><div><i style="background:#E7F2EC;color:#15654A">✓</i><span style="color:#1C1917;font-weight:700">মাসে ২–৩ কেজি, বাড়ির খাবারেই</span></div></div>
  <div class="art"><svg viewBox="0 0 480 168" xmlns="http://www.w3.org/2000/svg" role="img">
<g>
 <circle cx="150" cy="76" r="46" fill="none" stroke="#C2410C" stroke-width="12"/>
 <circle cx="150" cy="76" r="46" fill="none" stroke="#F7D9C6" stroke-width="4" stroke-dasharray="4 8"/>
 <path d="M150 122 q-40 22 -66 10" stroke="#C2410C" stroke-width="12" fill="none" stroke-linecap="round"/>
 <circle cx="150" cy="76" r="26" fill="#FDFBF7" stroke="#C2410C" stroke-width="2.5"/>
 <text x="150" y="82" font-size="15" fill="#C2410C" font-weight="700" text-anchor="middle">কোমর</text>
</g>
<g>
 <rect x="266" y="66" width="106" height="60" rx="10" fill="#FFFFFF" stroke="#15654A" stroke-width="2.5"/>
 <rect x="284" y="80" width="70" height="26" rx="5" fill="#CFE6DA"/>
 <text x="319" y="99" font-size="15" fill="#0E4433" font-weight="700" text-anchor="middle">— · — kg</text>
 <path d="M290 66 l0 -8 h58 l0 8" stroke="#15654A" stroke-width="2.5" fill="none"/>
</g>
<text x="240" y="160" font-size="12.5" fill="#44403C" font-weight="600" text-anchor="middle">সপ্তাহে একদিন — রবিবার সকালে, খালি পেটে, দুটোই মাপুন</text></svg></div>
  <div class="strip"><div class="t" style="color:#44403C">যা সত্যি, তাই লেখা · ৬১ পাতা</div><div class="p"><s style="color:#8A8378">₹৩৯৯</s><span style="color:#C2410C">₹২৯৯</span></div></div><div class="band"></div>
</div></body></html>
