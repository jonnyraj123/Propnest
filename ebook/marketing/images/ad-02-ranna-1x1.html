<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-400.ttf');font-weight:400;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-600.ttf');font-weight:600;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-700.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'NSB',sans-serif}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;
    flex-direction:column;justify-content:center;padding:78px;color:#fff}
.kick{display:inline-block;align-self:flex-start;font-size:26px;letter-spacing:.16em;
  font-weight:700;padding:12px 30px;border-radius:60px;margin-bottom:26px}
h1{font-size:104px;line-height:1.06;font-weight:700;letter-spacing:-2px}
.sub{font-size:38px;line-height:1.45;font-weight:600;margin-top:26px}
.rule{width:120px;height:11px;border-radius:8px;margin:26px 0}
.art{margin:34px 0;background:linear-gradient(160deg,#FDFBF7,#F1ECE2);
  border-radius:26px;padding:26px 26px 14px}
.art svg{width:100%;height:auto;max-height:300px}
.strip{position:absolute;left:0;right:0;bottom:0;padding:40px 78px;
  display:flex;align-items:center;justify-content:space-between;gap:20px}
.strip .t{font-size:26px;font-weight:600;line-height:1.35}
.strip .p{font-size:52px;font-weight:700;white-space:nowrap}
.strip .p s{font-size:30px;font-weight:600;opacity:.55;margin-right:14px}
.band{position:absolute;left:0;right:0;bottom:0;height:14px;
  background:linear-gradient(90deg,#F59E0B,#EA580C 55%,#C2410C)}
.glow{position:absolute;border-radius:50%;filter:blur(2px)}
.rowlist{margin-top:26px}
.rowlist div{display:flex;align-items:center;gap:20px;font-size:33px;
  font-weight:600;margin-bottom:18px}
.rowlist i{width:46px;height:46px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:700}
.num{display:flex;gap:24px;margin-top:26px}
.num .c{flex:1;border-radius:26px;padding:34px;text-align:center}
.num .c .b{font-size:78px;font-weight:700;line-height:1}
.num .c .s{font-size:26px;font-weight:600;margin-top:10px;opacity:.85}
</style></head><body><div class="ad" style="background:linear-gradient(165deg,#FDFBF7 0%,#F2EDE3 100%);color:#1C1917">
  <div class="kick" style="background:#15654A;color:#fff">গৃহিণীদের জন্য</div>

  <div class="rule" style="background:#C2410C"></div>
  <div class="sub" style="color:#44403C">বাড়ির সবাই একই খাবার খাবে।<br>শুধু আপনার পাতে পরিমাণটা মাপা।</div>
  <div class="art"><svg viewBox="0 0 480 168" xmlns="http://www.w3.org/2000/svg" role="img">

<text x="212" y="58" font-size="12" fill="#C2410C" font-weight="700">↑ উপরে সরান</text>

<g>
 <circle cx="96" cy="112" r="15" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>

 <ellipse cx="140" cy="112" rx="18" ry="12" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>
 <ellipse cx="140" cy="106" rx="18" ry="5" fill="#FFFFFF" stroke="#15654A" stroke-width="2"/>
 <rect x="176" y="92" width="18" height="38" rx="8" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>

</g>
<text x="252" y="112" font-size="12" fill="#15654A" font-weight="700">↓ সামনে রাখুন</text>
<text x="252" y="126" font-size="10" fill="#44403C">ফল · দই · কাটা সবজি · জল</text></svg></div>
  <div class="strip"><div class="t" style="color:#44403C">৩০ দিনের চার্ট · ১৫টি রেসিপি</div><div class="p"><s style="color:#8A8378">₹৩৯৯</s><span style="color:#C2410C">₹২৯৯</span></div></div><div class="band"></div>
</div></body></html>
