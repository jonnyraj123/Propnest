<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-400.ttf');font-weight:400;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-600.ttf');font-weight:600;}
@font-face{font-family:'NSB';src:url('../../assets/NotoSansBengali-700.ttf');font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'NSB',sans-serif}
.ad{width:1080px;height:1080px;position:relative;overflow:hidden;display:flex;
    flex-direction:column;justify-content:center;padding:78px;color:#fff}
.kick{display:inline-block;align-self:flex-start;font-size:26px;letter-spacing:.16em;
  font-weight:700;padding:12px 30px;border-radius:60px;margin-bottom:26px}
h1{font-size:104px;line-height:1.06;font-weight:700;letter-spacing:-2px}
.sub{font-size:38px;line-height:1.45;font-weight:600;margin-top:26px}
.rule{width:120px;height:11px;border-radius:8px;margin:26px 0}
.art{margin:34px 0;background:linear-gradient(160deg,#FDFBF7,#F1ECE2);
  border-radius:26px;padding:26px 26px 14px}
.art svg{width:100%;height:auto;max-height:300px}
.strip{position:absolute;left:0;right:0;bottom:0;padding:40px 78px;
  display:flex;align-items:center;justify-content:space-between;gap:20px}
.strip .t{font-size:26px;font-weight:600;line-height:1.35}
.strip .p{font-size:52px;font-weight:700;white-space:nowrap}
.strip .p s{font-size:30px;font-weight:600;opacity:.55;margin-right:14px}
.band{position:absolute;left:0;right:0;bottom:0;height:14px;
  background:linear-gradient(90deg,#F59E0B,#EA580C 55%,#C2410C)}
.glow{position:absolute;border-radius:50%;filter:blur(2px)}
.rowlist{margin-top:26px}
.rowlist div{display:flex;align-items:center;gap:20px;font-size:33px;
  font-weight:600;margin-bottom:18px}
.rowlist i{width:46px;height:46px;border-radius:50%;flex:none;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:26px;font-weight:700}
.num{display:flex;gap:24px;margin-top:26px}
.num .c{flex:1;border-radius:26px;padding:34px;text-align:center}
.num .c .b{font-size:78px;font-weight:700;line-height:1}
.num .c .s{font-size:26px;font-weight:600;margin-top:10px;opacity:.85}
</style></head><body><div class="ad" style="background:linear-gradient(165deg,#FDFBF7 0%,#F2EDE3 100%);color:#1C1917">
  <div class="kick" style="background:#C2410C;color:#fff">বইয়ের সবচেয়ে দামি পাতা</div>
  <h1 style="color:#0E4433">হাতের মাপেই<br><span style="color:#C2410C">পরিমাণ।</span></h1>
  <div class="rule" style="background:#15654A"></div>
  <div class="sub" style="color:#44403C">ওজন মাপার যন্ত্র নেই। ক্যালরি গোনা নেই।</div>
  <div class="art"><svg viewBox="0 0 480 168" xmlns="http://www.w3.org/2000/svg" role="img">
<g>
 <rect x="30" y="52" width="52" height="56" rx="14" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>
 <rect x="36" y="26" width="9" height="30" rx="4.5" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>
 <rect x="48" y="20" width="9" height="36" rx="4.5" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>
 <rect x="60" y="24" width="9" height="32" rx="4.5" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>

 <rect x="14" y="60" width="20" height="9" rx="4.5" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>
</g><text x="52" y="152" font-size="12" fill="#15654A" text-anchor="middle" font-weight="600">তালু = প্রোটিন</text>
<g>
 <rect x="150" y="40" width="62" height="62" rx="18" fill="#F7D9C6" stroke="#C2410C" stroke-width="2.5"/>
 <line x1="162" y1="58" x2="200" y2="58" stroke="#C2410C" stroke-width="2"/>
 <line x1="162" y1="72" x2="200" y2="72" stroke="#C2410C" stroke-width="2"/>
 <line x1="162" y1="86" x2="200" y2="86" stroke="#C2410C" stroke-width="2"/>
 <rect x="136" y="52" width="18" height="9" rx="4.5" fill="#F7D9C6" stroke="#C2410C" stroke-width="2.5"/>
</g><text x="178" y="152" font-size="12" fill="#C2410C" text-anchor="middle" font-weight="600">মুঠো = সবজি</text>
<g>
 <path d="M262 52 q34 -22 68 0 q-8 50 -34 50 q-26 0 -34 -50 Z" fill="#F6E2BE" stroke="#B45309" stroke-width="2.5"/>
 <ellipse cx="296" cy="54" rx="34" ry="9" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/>
 <circle cx="286" cy="52" r="3" fill="#B45309"/><circle cx="300" cy="55" r="3" fill="#B45309"/>
 <circle cx="308" cy="50" r="3" fill="#B45309"/>
</g><text x="296" y="152" font-size="12" fill="#B45309" text-anchor="middle" font-weight="600">কোষ = ভাত</text>
<g>
 <rect x="404" y="46" width="22" height="56" rx="11" fill="#CFE6DA" stroke="#15654A" stroke-width="2.5"/>
 <ellipse cx="415" cy="46" rx="11" ry="7" fill="#FFFFFF" stroke="#15654A" stroke-width="2.5"/>
</g><text x="415" y="152" font-size="12" fill="#15654A" text-anchor="middle" font-weight="600">আঙুল = তেল</text></svg></div>
  <div class="strip"><div class="t" style="color:#44403C">একবার শিখলে সারাজীবন কাজে লাগবে</div><div class="p"><s style="color:#8A8378">₹৩৯৯</s><span style="color:#C2410C">₹২৯৯</span></div></div><div class="band"></div>
</div></body></html>
