<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=12">
<link rel="icon" href="img/b/fav.png">
<title>Design · M.A ALIMUDDIN Garments</title>
<meta name="description" content="Wholesale kidswear design with size and colour chart.">
</head>
<body data-page="shop">
<div id="hdr"></div>
<main class="wrap">
  <div class="pd" id="pd"></div>
  <section style="padding-bottom:30px"><div class="sec-h"><div><p class="eyebrow">Pairs well on the rack</p><h2>You may also <em>like</em></h2></div></div><div class="grid" id="more"></div></section>
</main>
<div class="zoom" id="zoom" role="dialog" aria-label="Zoomed photo"><img alt=""></div>
<div id="ftr"></div>
<script src="assets/js/lenis.min.js"></script>
<script src="assets/data.js?v=12"></script>
<script src="assets/app.js?v=12"></script>
<script>
(() => {
  const { $, $$, img, byId, catName, swatch, wa, card, tilt, watch, toast, confetti, store, contactBtns, payCard, openModal } = AG;
  const MOQ = SHOP.moq;
  const p = byId(new URLSearchParams(location.search).get('id')) || PRODUCTS[0];
  document.title = p.name + ' · M.A ALIMUDDIN Garments';
  const q = {};
  const key = (c, s) => c + '|' + s;
  const pcs = () => Object.values(q).reduce((a, b) => a + b, 0);

  $('#pd').innerHTML = `
    <div class="gal">
      <div class="thumbs" role="tablist" aria-label="Photos">${p.img.map((n, i) => `<button class="${i ? '' : 'on'}" data-i="${i}" aria-label="Photo ${i + 1}"><img src="${img(n, 1)}" alt=""></button>`).join('')}</div>
      <div class="main-img" id="mainImg"><img src="${img(p.img[0])}" alt="${p.name}"></div>
    </div>
    <div>
      <p class="crumbs"><a href="index.html">Home</a> / <a href="shop.html?cat=${p.cat}">${catName(p.cat)}</a></p>
      ${p.code ? `<span class="pd-code">CODE ${p.code}</span>` : ''}
      <h1>${p.name}</h1>
      <div class="rate-box"><h4>Best wholesale rate on call</h4><p>Call or WhatsApp us for today's price and the colour chart of this design.</p>
        <div class="perk-chips"><span>💵 Cash on Delivery</span><span>📱 PhonePe · Paytm · UPI</span><span>🎨 3 colours</span><span>📦 Min. ${MOQ} pcs</span></div>
        ${contactBtns(p, true)}</div>
      <div class="sizes-box"><h4>Sizes in this design</h4>${AG.sizeGuide(p)}<p>Every size comes in <b>${p.colours.length} colours</b>. Mix any sizes &amp; colours — minimum <b>${MOQ} pieces</b>.</p></div>
      <div class="matrix-w">
        <h3>Make your order chart</h3>
        <p class="muted" style="font-size:14px">Mix any sizes and colours. Minimum ${MOQ} pieces for this design. Not sure? Tap <b>Smart ${MOQ} pack</b> for a ready-to-sell mix.</p>
        <div class="mx-scroll"><table class="mx"><thead><tr><th></th>${p.sizes.map(s => `<th>${s}</th>`).join('')}</tr></thead><tbody>
          ${p.colours.map(c => `<tr><th class="c"><span style="display:inline-flex;align-items:center;gap:6px"><i style="width:14px;height:14px;border-radius:50%;background:${swatch(c)};display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.12)"></i>${c}</span></th>${p.sizes.map(s => `<td><span class="qty"><button data-d="-1" data-k="${key(c, s)}" aria-label="Less ${c} size ${s}">−</button><input inputmode="numeric" value="0" data-k="${key(c, s)}" aria-label="${c} size ${s} pieces"><button data-d="1" data-k="${key(c, s)}" aria-label="More ${c} size ${s}">+</button></span></td>`).join('')}</tr>`).join('')}
        </tbody></table></div>
        <div class="quick"><button class="smart" data-smart>✨ Smart ${MOQ} pack</button><button data-fill="1">+1 of every size &amp; colour</button><button data-fill="0">Clear</button></div>
        <div class="prog"><div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="27" fill="none" stroke="#f0e6d6" stroke-width="7"/><circle id="ringC" cx="32" cy="32" r="27" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6" style="transition:stroke-dashoffset .5s"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#8a6420"/><stop offset="1" stop-color="#f1d891"/></linearGradient></defs></svg><b id="ringN">0</b></div><p id="progT"></p></div>
        <div class="shopf"><input id="shopN" placeholder="Your shop name" autocomplete="organization" aria-label="Your shop name"><input id="shopC" placeholder="City" autocomplete="address-level2" aria-label="City"></div>
        <div class="send-row"><button class="btn btn-wa" id="sendBtn">${AG.icoWa.replace('<svg', '<svg width="20" height="20"')} Send this order on WhatsApp</button></div>
        <p class="muted" style="font-size:13px;margin-top:8px;text-align:center">No payment now. We confirm price &amp; stock first, then you pay by PhonePe / Paytm / UPI or Cash on Delivery.</p>
      </div>
      <a class="dl-photo" href="${img(p.img[0])}" download="${p.id}.webp">⬇ Free photo for your shop's WhatsApp status</a>
      <div class="desc">
        <details open><summary>About this design</summary><p>${p.name} from our ${catName(p.cat).toLowerCase()} range. Comes in a ${p.colours.length}-colour chart${p.colours[0] === 'Colour A' ? ' — colour photos are shared on WhatsApp' : ': ' + p.colours.join(', ')}. Sizes ${p.sizes.join(', ')}.</p></details>
        <details><summary>Wholesale terms</summary><ul><li>Minimum ${MOQ} pieces per design (mix sizes &amp; colours)</li><li>Price and stock confirmed on call / WhatsApp</li><li>Pay by PhonePe, Paytm, UPI or Cash on Delivery</li></ul></details>
        <details><summary>Delivery</summary><p>Pick up from our Kolkata shop, or we send by courier / transport anywhere in India. Charges are confirmed before dispatch.</p></details>
      </div>
    </div>`;

  /* gallery + zoom */
  const main = $('#mainImg img');
  $('.thumbs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $$('.thumbs button').forEach(x => x.classList.toggle('on', x === b)); main.style.opacity = 0; setTimeout(() => { main.src = img(p.img[+b.dataset.i]); main.style.opacity = 1; $('.dl-photo').href = main.src; }, 180); });
  const zoom = $('#zoom');
  $('#mainImg').addEventListener('click', () => { $('img', zoom).src = main.src; zoom.classList.add('on'); });
  zoom.addEventListener('click', () => zoom.classList.remove('on'));
  if (AG.fine) { $('#mainImg').addEventListener('pointermove', e => { const r = e.currentTarget.getBoundingClientRect(); main.style.transformOrigin = `${(e.clientX - r.left) / r.width * 100}% ${(e.clientY - r.top) / r.height * 100}%`; main.style.transform = 'scale(1.6)'; }); $('#mainImg').addEventListener('pointerleave', () => main.style.transform = ''); }

  /* order chart */
  let celebrated = false;
  const sync = () => {
    $$('.mx input').forEach(i => { const v = q[i.dataset.k] || 0; if (+i.value !== v) i.value = v; i.parentElement.classList.toggle('has', v > 0); });
    const n = pcs(), ok = n >= MOQ, t = $('#progT');
    $('#ringN').textContent = n;
    $('#ringC').style.strokeDashoffset = 169.6 * (1 - Math.min(n / MOQ, 1));
    t.className = ok ? 'ok' : '';
    t.innerHTML = ok ? `🎉 ${n} pieces ready to send` : n ? `Add <b>${MOQ - n}</b> more piece${MOQ - n === 1 ? '' : 's'} to reach the minimum of ${MOQ}` : `Fill the chart or tap Smart ${MOQ} pack`;
    if (ok && !celebrated) { celebrated = true; const r = $('.ring').getBoundingClientRect(); confetti(r.left + 32, r.top + 32, 40); }
    if (!ok) celebrated = false;
  };
  const setK = (k, v) => { v = Math.max(0, Math.min(999, parseInt(v) || 0)); if (v) q[k] = v; else delete q[k]; };
  $('.mx').addEventListener('click', e => { const b = e.target.closest('button[data-d]'); if (!b) return; setK(b.dataset.k, (q[b.dataset.k] || 0) + +b.dataset.d); sync(); });
  $('.mx').addEventListener('input', e => { if (e.target.dataset.k) { setK(e.target.dataset.k, e.target.value.replace(/\D/g, '')); sync(); } });
  $('.mx').addEventListener('focusin', e => { if (e.target.tagName === 'INPUT') e.target.select(); });
  /* Smart pack: every colour, middle sizes get the extra pieces (they sell fastest) */
  const smart = () => {
    Object.keys(q).forEach(k => delete q[k]);
    const mid = (p.sizes.length - 1) / 2;
    const order = p.sizes.map((s, i) => ({ s, d: Math.abs(i - mid) })).sort((a, b) => a.d - b.d).map(x => x.s);
    let left = MOQ, round = 0;
    while (left > 0 && round < 50) { for (const s of order) for (const c of p.colours) { if (left <= 0) break; if (round > 0 && order.indexOf(s) >= Math.ceil(order.length / 2)) continue; q[key(c, s)] = (q[key(c, s)] || 0) + 1; left--; } round++; }
    sync(); toast(`✨ Smart pack ready: ${MOQ} pcs, all colours, more in the best-selling sizes`);
  };
  $('.quick').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.smart !== undefined) return smart(); const f = +b.dataset.fill; p.colours.forEach(c => p.sizes.forEach(s => { const k = key(c, s); setK(k, f ? (q[k] || 0) + f : 0); })); sync(); });

  /* shop name is remembered for next time */
  const saved = store.get('ag_shop', {}); $('#shopN').value = saved.shop || ''; $('#shopC').value = saved.city || '';

  /* send order on WhatsApp */
  const lines = () => p.colours.map(c => { const r = p.sizes.filter(s => q[key(c, s)]).map(s => `${s}×${q[key(c, s)]}`); return r.length ? `${c}: ${r.join(', ')}` : ''; }).filter(Boolean);
  $('#sendBtn').addEventListener('click', () => {
    const n = pcs();
    if (n < MOQ) { toast(n ? `Please add ${MOQ - n} more pieces (minimum ${MOQ}) — or tap ✨ Smart ${MOQ} pack` : `Fill the chart first — or tap ✨ Smart ${MOQ} pack`); $('.mx-scroll').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    const shop = $('#shopN').value.trim(), city = $('#shopC').value.trim();
    store.set('ag_shop', { shop, city });
    const msg = `Hi M.A ALIMUDDIN Garments, I want to order:\n\n*${p.name}*${p.code ? ' (Code ' + p.code + ')' : ''}\n${lines().join('\n')}\nTotal: ${n} pcs\n${shop ? '\nShop: ' + shop : ''}${city ? '\nCity: ' + city : ''}\n\nPlease confirm the price and delivery.`;
    store.set('ag_last', { id: p.id, q: { ...q }, at: Date.now() });
    open(wa(msg), '_blank', 'noopener');
    openModal('Order sent ✓', `<div class="sent-ok"><div class="big">🎀</div><h4>Thank you${shop ? ', ' + shop : ''}!</h4><p>Your ${n}-piece order opened in WhatsApp. Press <b>send</b> there. We will reply with the price and delivery.</p></div>${payCard()}`);
  });
  sync();

  /* related */
  $('#more').innerHTML = PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).concat(PRODUCTS.filter(x => x.cat !== p.cat && x.tag)).slice(0, 4).map(card).join('');
  watch(); tilt();
})();
</script>
</body>
</html>
